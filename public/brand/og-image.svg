<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#faf8f4"/>

  <!-- Left green panel -->
  <rect width="520" height="630" fill="#1a6b4a"/>

  <!-- Decorative rings on left panel -->
  <circle cx="100" cy="100"  r="180" stroke="white" stroke-opacity="0.08" stroke-width="1" fill="none"/>
  <circle cx="520" cy="580"  r="220" stroke="white" stroke-opacity="0.06" stroke-width="1" fill="none"/>
  <circle cx="260" cy="315"  r="340" stroke="white" stroke-opacity="0.05" stroke-width="1" fill="none"/>

  <!-- Dot grid on left -->
  <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="white" fill-opacity="0.08"/>
  </pattern>
  <rect width="520" height="630" fill="url(#dots)"/>

  <!-- Left panel content -->
  <!-- Icon -->
  <rect x="60" y="60" width="70" height="70" rx="16" fill="white" fill-opacity="0.15"/>
  <polygon points="95,76 117,87 117,113 95,124 73,113 73,87" fill="white" fill-opacity="0.15" stroke="white" stroke-width="1.5"/>
  <circle cx="95" cy="100" r="9" fill="white"/>
  <line x1="95" y1="87"  x2="95" y2="80"  stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="95" y1="120" x2="95" y2="113" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="78" y1="100" x2="85" y2="100" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="105" y1="100" x2="112" y2="100" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- Brand name on left -->
  <text x="60" y="240" font-family="Georgia, serif" font-size="64" font-weight="700" fill="white" letter-spacing="-1">Jowel</text>
  <text x="60" y="310" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#f0d99a" letter-spacing="-1">Store</text>

  <!-- Tagline -->
  <text x="60" y="360" font-family="Arial, sans-serif" font-size="14" fill="white" fill-opacity="0.7" letter-spacing="3">PREMIUM GROCERY &amp; JEWELLERY</text>

  <!-- Feature pills -->
  <rect x="60" y="400" width="130" height="34" rx="17" fill="white" fill-opacity="0.15"/>
  <text x="95" y="422" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">🥦 Fresh Daily</text>

  <rect x="204" y="400" width="130" height="34" rx="17" fill="white" fill-opacity="0.15"/>
  <text x="269" y="422" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">💎 Certified Gems</text>

  <rect x="60" y="448" width="140" height="34" rx="17" fill="white" fill-opacity="0.15"/>
  <text x="130" y="470" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">🚚 Same-day Delivery</text>

  <!-- Trusted note -->
  <text x="60" y="560" font-family="Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.5">Trusted by 10,000+ happy customers</text>

  <!-- Right panel content -->
  <!-- Decorative circles right -->
  <circle cx="900" cy="200" r="260" fill="#e8f5ef" fill-opacity="0.5"/>
  <circle cx="1100" cy="500" r="180" fill="#e8f5ef" fill-opacity="0.3"/>

  <!-- Right headline -->
  <text x="580" y="200" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#134d36" letter-spacing="-1">Fresh picks,</text>
  <text x="580" y="265" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#c8972a" font-style="italic" letter-spacing="-1">finest gems.</text>

  <text x="580" y="320" font-family="Arial, sans-serif" font-size="16" fill="#6b7280" letter-spacing="0">Everything you need — groceries to jewellery,</text>
  <text x="580" y="345" font-family="Arial, sans-serif" font-size="16" fill="#6b7280">delivered to your door with care.</text>

  <!-- CTA button shape -->
  <rect x="580" y="390" width="200" height="52" rx="14" fill="#1a6b4a"/>
  <text x="680" y="421" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">Shop Now →</text>

  <!-- Stats -->
  <text x="580" y="510" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#1a6b4a">10K+</text>
  <text x="580" y="535" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af" letter-spacing="1">CUSTOMERS</text>

  <text x="730" y="510" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#1a6b4a">500+</text>
  <text x="730" y="535" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af" letter-spacing="1">PRODUCTS</text>

  <text x="880" y="510" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#1a6b4a">4.9★</text>
  <text x="880" y="535" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af" letter-spacing="1">RATING</text>

  <!-- URL -->
  <text x="580" y="600" font-family="Arial, sans-serif" font-size="13" fill="#9ca3af">www.jowelstore.com</text>
</svg>
